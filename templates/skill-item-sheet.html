<div class="more-fate-skill-inner flexcol">
<header class="sheet-header flexrow">
  <img class="profile-img" src="{{data.img}}" title="{{data.name}}" data-edit="img" />
  <div class="header-fields flexcol">
    <h1><input type="text" name="name" value="{{data.name}}" placeholder="Skill name" /></h1>
    <div class="sheet-subtitle">Fate Skill</div>
  </div>
</header>

<section class="sheet-body">

  <div class="form-group stacked">
    <label>Description</label>
    <textarea name="system.description" rows="4" placeholder="What does this skill represent?">{{system.description}}</textarea>
  </div>

  <div class="form-group stacked">
    <label>Overcome</label>
    <textarea name="system.overcome" rows="3" placeholder="How is this skill used to Overcome obstacles?">{{system.overcome}}</textarea>
  </div>

  <div class="form-group stacked">
    <label>Create an Advantage</label>
    <textarea name="system.caa" rows="3" placeholder="How is this skill used to Create an Advantage?">{{system.caa}}</textarea>
  </div>

  <div class="form-group stacked">
    <label>Attack</label>
    <textarea name="system.attack" rows="3" placeholder="How is this skill used to Attack?">{{system.attack}}</textarea>
  </div>

  <div class="form-group stacked">
    <label>Defend</label>
    <textarea name="system.defend" rows="3" placeholder="How is this skill used to Defend?">{{system.defend}}</textarea>
  </div>

</section>

<footer class="sheet-footer">
  <button type="submit"><i class="fas fa-save"></i> Save</button>
</footer>
</div>
